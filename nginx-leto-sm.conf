server {
    listen 80;
    server_name leto-sm-platform.ru www.leto-sm-platform.ru;

    # Redirect HTTP to HTTPS (optional, configure SSL on Reg.ru panel)
    # return 301 https://$server_name$request_uri;

    # Frontend static files
    location / {
        root /home/leto-sm/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Logo and public assets
    location /logo.png {
        root /home/leto-sm/frontend/public;
    }
}
